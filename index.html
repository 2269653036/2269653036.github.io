<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#19a66a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>砖了个砖助手 V16</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#15231d;background:#eef7f2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eaf8f1,#f7faf8);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 46px}.hero{padding:8px 4px 4px}.hero h1{font-size:28px;margin:4px 0}.hero p{margin:6px 0;color:#52635b;line-height:1.55}
.card{background:#fff;border:1px solid #dce9e2;border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 5px 18px rgba(18,70,46,.07)}
.title{font-size:18px;font-weight:800;margin-bottom:10px}.small{font-size:13px;color:#66766e;line-height:1.5}.ok{color:#087a48}.bad{color:#b42318}.hide{display:none!important}
.file{display:block;border:2px dashed #9bcdb3;border-radius:15px;padding:20px 12px;text-align:center;background:#f5fcf8;font-weight:750;cursor:pointer}.file input{display:none}
button{appearance:none;border:0;border-radius:14px;padding:14px 15px;font-size:17px;font-weight:800;background:#148f5a;color:white;width:100%;margin-top:10px;box-shadow:0 4px 10px rgba(20,143,90,.16)}
button:disabled{opacity:.42;box-shadow:none}button.secondary{background:#edf4f0;color:#1b3328;box-shadow:none}.row{display:flex;gap:9px}.row button{flex:1}
canvas{display:block;width:100%;height:auto;border-radius:12px;background:#8e541f}.preview{background:#111;border-radius:14px;overflow:hidden}
.status{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f2f6f4;font-size:14px;line-height:1.55}
.stepHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.badge{background:#e7f7ef;color:#087a48;font-weight:800;border-radius:999px;padding:6px 10px;white-space:nowrap}
.instruction{font-size:18px;font-weight:800;line-height:1.55;margin:10px 0}.legend{font-size:13px;color:#596a62;line-height:1.6}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 8px}.red{background:#ff3131}.green{background:#21a366}.orange{background:#ff9f1c}
.progress{height:8px;border-radius:99px;background:#e6eee9;overflow:hidden;margin:8px 0}.bar{height:100%;background:#16a365;width:0}.foot{text-align:center;color:#718078;font-size:12px;margin-top:18px}
@media(max-width:420px){.wrap{padding-left:10px;padding-right:10px}.hero h1{font-size:25px}.instruction{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🧩 砖了个砖助手</h1>
    <p>全自动版：已经把你发来的 5 页全部砖块做成完整参考库。以后只上传游戏截图，不需要再一个个手动选择图标。</p>
  </div>

  <div class="card">
    <div class="title">1. 上传游戏原始截图</div>
    <label class="file">📷 选择截图<input id="fileInput" type="file" accept="image/*"></label>
    <div id="fileStatus" class="status">请上传游戏本身的完整截图，不要上传网页里的步骤图。</div>
  </div>

  <div class="card hide" id="previewCard">
    <div class="title">2. 全自动识别 + 安全验证</div>
    <div class="small">内置 288 种完整砖块参考。系统先用完整图库识别，再用当前棋盘里“同图案像素必须一致”的规则二次校验；有歧义会自己尝试多种分组，不让你手动选。</div>
    <div class="preview"><canvas id="previewCanvas"></canvas></div>
    <button id="solveBtn">自动识别并计算完整路线</button>
    <div id="recognitionStatus" class="status hide"></div>
  </div>

  <div class="card hide" id="solveCard">
    <div class="stepHead"><div class="title" style="margin:0">3. 按步骤操作</div><div class="badge" id="stepBadge">准备中</div></div>
    <div class="progress"><div class="bar" id="progressBar"></div></div>
    <div class="instruction" id="instruction">正在计算……</div>
    <canvas id="boardCanvas"></canvas>
    <div class="legend"><span class="dot red"></span>红框：你要动的砖 <span class="dot orange"></span>橙框：会被一起推动 <span class="dot green"></span>绿框：真正配对消除目标</div>
    <div class="row"><button class="secondary" id="prevBtn">上一步</button><button id="nextBtn">我做完了，下一步</button></div>
    <button class="secondary" id="restartBtn">换一张截图重新计算</button>
  </div>

  <div class="foot">v16 全自动稳定版 · 288种完整砖块图库 + 同局像素自校验 · 不需要人工逐个配对</div>
</div>

  if(stepIndex>=total){
    stepBadge.textContent='完成';instruction.textContent='🎉 棋盘已经按这条路线全部清空。';
    progressBar.style.width='100%';drawSolutionBoard(solutionStates[solutionStates.length-1],null);
    prevBtn.disabled=false;nextBtn.disabled=true;return;
  }
  stepBadge.textContent=`第 ${stepIndex+1} / ${total} 步`;
  progressBar.style.width=((stepIndex)/total*100).toFixed(1)+'%';
  const b=solutionStates[stepIndex],m=solutionMoves[stepIndex];
  instruction.textContent=actionText(m);drawSolutionBoard(b,m);
  prevBtn.disabled=stepIndex===0;nextBtn.disabled=false;
}
function sourceCellRect(i){const g=lastGeom,[r,c]=rc(i);return [g.x+c*g.cw,g.y+r*g.ch,g.cw,g.ch]}
prevBtn.addEventListener('click',()=>{if(stepIndex>0){stepIndex--;renderStep();window.scrollTo({top:solveCard.offsetTop-8,behavior:'smooth'})}});
nextBtn.addEventListener('click',()=>{if(stepIndex<solutionMoves.length){stepIndex++;renderStep();window.scrollTo({top:solveCard.offsetTop-8,behavior:'smooth'})}});
$('restartBtn').addEventListener('click',()=>{solveCard.classList.add('hide');previewCard.classList.add('hide');fileInput.value='';img=null;window.scrollTo({top:0,behavior:'smooth'})});

solveBtn.addEventListener('click',async()=>{
  if(!img)return;solveBtn.disabled=true;solveCard.classList.add('hide');recognitionStatus.classList.remove('hide');recognitionStatus.textContent='正在读取 288 种完整砖块图库，并做同局像素自校验……';
  try{
    const rec=await extractBoard();await sleep(10);const cands=makeCandidates(rec);
    if(!cands.length)throw new Error('没有生成安全的自动分组。');
    lastRecognitionSummary=`<span class="ok">✓ V16全自动识别：</span>${rec.filled.length} 块砖；完整图库 288 种；自动生成 ${cands.length} 套安全分组候选。`;
    recognitionStatus.innerHTML=lastRecognitionSummary+'<br>正在逐套验证，只有能完整清盘的结果才会显示……';
    let solved=null,total=0,bestFail=null;
    for(let i=0;i<cands.length;i++){
      recognitionStatus.innerHTML=`${lastRecognitionSummary}<br>正在验证自动分组 ${i+1}/${cands.length}……`;
      const r=await solveOneBoard(cands[i].board,lastRecognitionSummary,i<3);total+=r.expanded;
      if(r.solved){solved={r,c:cands[i]};break}
      if(!bestFail||r.bestRemain<bestFail.r.bestRemain)bestFail={r,c:cands[i]};
    }
    if(!solved){
      const r=await solveOneBoard(cands[0].board,lastRecognitionSummary,false);total+=r.expanded;
      if(r.solved)solved={r,c:cands[0]};else throw new Error(`自动安全模式未找到完整解（最好剩 ${r.bestRemain} 块）。为了不出错，本次不会给错误路线；请重新截一张游戏原始截图再试。`);
    }
    reps=solved.c.reps;initialBoard=solved.c.board;solutionMoves=solved.r.moves;solutionStates=solved.r.states;stepIndex=0;
    recognitionStatus.innerHTML=`${lastRecognitionSummary}<br><span class="ok">✓ 已通过完整清盘验证：</span>${solutionMoves.length} 步；其中 ${solved.c.strong} 块由完整图库直接确认，${solved.c.amb} 块由当前棋盘像素自动配对；无需人工选择。`;
    solveCard.classList.remove('hide');renderStep();setTimeout(()=>solveCard.scrollIntoView({behavior:'smooth',block:'start'}),80);
  }catch(e){recognitionStatus.innerHTML=`${lastRecognitionSummary?lastRecognitionSummary+'<br>':''}<span class="bad">✕ ${e.message}</span>`}
  finally{solveBtn.disabled=false}
});
</script>
