}

  const url='https://api.github.com/repos/2269653036/2269653036.github.io/contents/index.html?ref='+BASE_COMMIT;
  const r=await fetch(url,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!r.ok)throw new Error('GitHub API HTTP '+r.status);
  const j=await r.json();
  const t=new TextDecoder('utf-8').decode(bytesFromB64(j.content||''));
  if(!t.includes('const REF_B64=')||!t.includes('function availableMoves'))throw new Error('API 基线内容不完整');
  return t;
}
async function getBase(){
  const urls=[
    'https://cdn.jsdelivr.net/gh/2269653036/2269653036.github.io@'+BASE_COMMIT+'/index.html',
    'https://raw.githubusercontent.com/2269653036/2269653036.github.io/'+BASE_COMMIT+'/index.html'
  ];
  const errors=[];
  for(const u of urls){
    try{ boot.textContent='正在加载识别基线……'; return await fetchText(u); }catch(e){ errors.push(e.message); }
  }
  try{ return await fetchFromApi(); }catch(e){ errors.push(e.message); }
  throw new Error(errors.join('；'));
}
(async()=>{
  try{
    let html=await getBase();
    boot.textContent='识别库已加载，正在应用规则校正……';
    const extra='<scr'+'ipt>'+patchText()+'</scr'+'ipt>';
    if(!html.includes('</body>'))throw new Error('基线 HTML 缺少 body 结束标记');
    html=html.replace('</body>',extra+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    boot.innerHTML='<span class="bad">加载失败：'+String(e.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span><br>请确认手机能访问 GitHub / jsDelivr 后刷新页面。';
  }
})();
